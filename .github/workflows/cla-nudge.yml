# Asks first-time outside contributors to sign the Snowplow CLA.
#
# Run on public repositories by the "cla-nudge" enterprise ruleset.
# Rulesets ignore event filters and make this a required check, so the job:
#   - runs on opened, synchronize and reopened, and only comments once per PR
#     (it looks for its own hidden marker comment, so maintainers can change labels freely)
#   - never fails, so it never blocks a merge
#
# Skipped for private repositories (covered by staff agreements), bots, returning contributors,
# org members and repo collaborators (checked via the API, so private memberships count), and
# PRs with @snowplowanalytics.com or @snowplow.io commit emails.
# Uses pull_request_target so it can comment on fork PRs. It never checks out PR code.

name: CLA nudge

on:
  pull_request_target:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: cla-nudge-${{ github.repository }}-${{ github.event.pull_request.number }}

jobs:
  cla-nudge:
    if: >-
      !github.event.repository.private &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR","FIRST_TIMER","NONE"]'),
               github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for the CLA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          MARKER='<!-- cla-nudge -->'

          if gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Already asked on this PR"
            exit 0
          fi

          # Org members, including private memberships that author_association reports as NONE.
          # Members get base read access, so they show as repo collaborators, as do invited outside collaborators.
          if gh api "repos/$REPO/collaborators/$AUTHOR" --silent 2>/dev/null; then
            echo "$AUTHOR is an org member or collaborator, skipping"
            exit 0
          fi

          # Backup for staff who are members of a different Snowplow org than this repo's
          if gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[].commit.author.email' \
              | grep -qiE '@(snowplowanalytics\.com|snowplow\.io)$'; then
            echo "Commits are from a Snowplow email, skipping"
            exit 0
          fi

          LOGO="https://raw.githubusercontent.com/snowplow/.github/main/assets"
          cat > "$RUNNER_TEMP/cla-comment.md" <<EOF
          $MARKER
          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="$LOGO/snowplow-logo-white.png">
            <img alt="Snowplow" src="$LOGO/snowplow-logo-navy.png" width="180">
          </picture>

          ### Thanks for your contribution, @$AUTHOR! 👋

          Before we can review this pull request, we need you to sign the Snowplow Contributor License Agreement (CLA). It only takes a minute, and you only need to do it once.

          - **Contributing for yourself?** Sign the [Individual CLA](https://docs.google.com/forms/d/1J1FNYq9538ndzzcBdlCbxPo1yFiOY4mwalhDTSl1pgg/viewform)
          - **Contributing for your employer?** Sign the [Corporate CLA](https://docs.google.com/forms/d/1ZUzz7lQJhs7oZqbkBL1bp0r048hAi7uIN6aLWCyZWWs/viewform)

          Once you've signed, reply here (e.g. *"I've signed the CLA"*) and a maintainer will pick up your review.

          <sub>This is an automated message. Find out more about the CLA [here](https://docs.snowplow.io/docs/contributing/contributor-license-agreement/). If you've already signed, you can ignore this.</sub>
          EOF

          gh label create 'cla:requested' -R "$REPO" --color FBCA04 \
            --description 'Asked the contributor to sign the CLA' 2>/dev/null
          gh pr edit "$PR" -R "$REPO" --add-label 'cla:requested'
          gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/cla-comment.md"

          exit 0
